name: Publish tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Validate tag and build
        shell: powershell
        run: |
          $version = [regex]::Match([IO.File]::ReadAllText('main.go'),'const version = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag and source version do not match.' }
          ./build.ps1
      - name: Frontend regression tests
        run: node --test tests/geometry.test.mjs
      - name: Native Windows acceptance
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy RemoteSigned -File ./tools/windows_smoke.ps1
      - name: Package
        shell: powershell
        run: |
          ./tools/package.ps1
          git archive --format=zip --prefix=ApplyKit/ --output=dist/ApplyKit_Source_v2.2.0_GitHub.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed.' }
      - name: Publish release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = (Get-ChildItem dist/ApplyKit_*.zip).FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "ApplyKit $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
